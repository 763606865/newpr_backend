[program:newpr-backend-queue]
process_name=%(program_name)s_%(process_num)02d
directory=%(here)s/../
command=/usr/bin/php artisan queue:work --sleep=3 --tries=3
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=%(here)s/../storage/logs/queue.log
