[program:newpr-backend-horizon]
process_name=%(program_name)s_%(process_num)02d
directory=%(here)s/../
command=/usr/bin/php artisan horizon
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
startsecs=5
startretries=3
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=%(here)s/../storage/logs/horizon.log
